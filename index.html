<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Endless Nightmare 8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        
        #blocker {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #0a0000; display:flex; flex-direction:column;
            justify-center: center; align-items:center; text-align:center;
            z-index: 1000; padding: 20px;
        }
        #blocker h1 { color: #ff1111; font-size: 2.2rem; margin-bottom: 10px; }
        #blocker p { color: #aaa; margin-bottom: 25px; }
        #startBtn {
            padding: 18px 36px; font-size: 1.2rem; font-weight: bold;
            color: #fff; background: #a00; border: 2px solid #f00;
            border-radius: 8px; cursor: pointer;
        }

        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        #keys { position: absolute; top: 15px; right: 15px; color: #ffd700; font-size: 1.1rem; font-weight: bold; }
        
        /* Mobile Touch Controls */
        #joyZone {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.1); border: 2px solid #f00; border-radius: 50%; pointer-events: auto;
        }
        #joyKnob {
            position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
            background: rgba(255,0,0,0.6); border-radius: 50%;
        }
        #lookZone { position: absolute; top: 0; right: 0; width: 60%; height: 100%; pointer-events: auto; }
        
        .btn {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            background: rgba(40,0,0,0.8); border: 2px solid #f00; color: #fff;
            font-weight: bold; font-size: 12px; pointer-events: auto;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        #btnStrike { bottom: 30px; right: 30px; border-color: #ffd700; color: #ffd700; }
        #btnLight { bottom: 120px; right: 30px; }
    </style>
</head>
<body>

    <div id="blocker">
        <h1>ENDLESS NIGHTMARE VIII</h1>
        <p>Tap below to start your horror mission.</p>
        <button id="startBtn">ENTER NIGHTMARE</button>
    </div>

    <div id="hud">
        <div id="keys">Keys: <span id="kVal">0</span> / 3</div>
        <div id="joyZone"><div id="joyKnob"></div></div>
        <div id="lookZone"></div>
        <button id="btnStrike" class="btn">MARTIAL<br>STRIKE</button>
        <button id="btnLight" class="btn">LIGHT</button>
    </div>

    <script>
        let scene, camera, renderer, flashlight, ghost;
        let keysArray = [], keysCollected = 0;
        let joyX = 0, joyY = 0, joyId = null;

        document.getElementById('startBtn').onclick = function() {
            document.getElementById('blocker').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            initGame();
        };

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050202);
            scene.fog = new THREE.FogExp2(0x050202, 0.08);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 0);

            flashlight = new THREE.SpotLight(0xffffff, 3, 20, Math.PI / 4, 0.5);
            camera.add(flashlight);
            flashlight.target.position.set(0, 0, -1);
            camera.add(flashlight.target);
            scene.add(camera);

            const ambient = new THREE.AmbientLight(0x221111, 0.4);
            scene.add(ambient);

            // Floor & Walls
            const floorGeo = new THREE.PlaneGeometry(40, 40);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x331111 });
            const wallGeo = new THREE.BoxGeometry(40, 4, 1);
            
            const w1 = new THREE.Mesh(wallGeo, wallMat); w1.position.set(0, 2, -20); scene.add(w1);
            const w2 = new THREE.Mesh(wallGeo, wallMat); w2.position.set(0, 2, 20); scene.add(w2);

            // Spawn Demon Ghost
            const ghostGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
            const ghostMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
            ghost = new THREE.Mesh(ghostGeo, ghostMat);
            ghost.position.set(0, 1, -10);
            scene.add(ghost);

            // Keys
            const kGeo = new THREE.OctahedronGeometry(0.3);
            const kMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });
            [-8, 0, 8].forEach(x => {
                let k = new THREE.Mesh(kGeo, kMat);
                k.position.set(x, 1, -12);
                scene.add(k);
                keysArray.push(k);
            });

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            setupTouchControls();
            animate();
        }

        function setupTouchControls() {
            const jZone = document.getElementById('joyZone');
            const jKnob = document.getElementById('joyKnob');

            jZone.ontouchstart = (e) => { joyId = e.changedTouches[0].identifier; };
            window.ontouchmove = (e) => {
                for (let t of e.touches) {
                    if (t.identifier === joyId) {
                        let rect = jZone.getBoundingClientRect();
                        let dx = t.clientX - (rect.left + 55);
                        let dy = t.clientY - (rect.top + 55);
                        let dist = Math.min(Math.hypot(dx, dy), 35);
                        let angle = Math.atan2(dy, dx);
                        joyX = (Math.cos(angle) * dist) / 35;
                        joyY = (Math.sin(angle) * dist) / 35;
                        jKnob.style.transform = `translate(${joyX * 20}px, ${joyY * 20}px)`;
                    }
                }
            };
            const resetJ = () => { joyX = 0; joyY = 0; joyId = null; jKnob.style.transform = 'translate(0,0)'; };
            window.ontouchend = resetJ;

            let lastX = 0, lastY = 0;
            const lZone = document.getElementById('lookZone');
            lZone.ontouchstart = (e) => { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; };
            lZone.ontouchmove = (e) => {
                let dx = e.touches[0].clientX - lastX;
                let dy = e.touches[0].clientY - lastY;
                camera.rotation.y -= dx * 0.005;
                camera.rotation.x -= dy * 0.005;
                lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            };

            document.getElementById('btnStrike').onclick = () => {
                if (camera.position.distanceTo(ghost.position) < 3.0) {
                    ghost.position.z -= 3; // Push ghost back
                }
            };

            document.getElementById('btnLight').onclick = () => {
                flashlight.visible = !flashlight.visible;
            };
        }

        function animate() {
            requestAnimationFrame(animate);

            // Movement
            camera.translateX(joyX * 0.08);
            camera.translateZ(joyY * 0.08);
            camera.position.y = 1.6;

            // Ghost pursuit
            ghost.lookAt(camera.position);
            ghost.translateZ(0.02);

            // Collect keys
            keysArray.forEach(k => {
                if (k.visible) {
                    k.rotation.y += 0.03;
                    if (camera.position.distanceTo(k.position) < 1.5) {
                        k.visible = false;
                        keysCollected++;
                        document.getElementById('kVal').innerText = keysCollected;
                    }
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
